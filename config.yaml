
model:
  name: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
  dtype: bfloat16
  tensor_parallel_size: 2
  gpu_memory_utilization: 0.92
  disable_custom_all_reduce: true
  max_model_len: 18432

sampling:
  temperature: 0.6
  top_p: 0.95
  max_thinking_tokens: 16384
  max_answer_tokens: 1024
  n_samples: 4
  base_seed: 20261024

prompt:
  system: null
  template: "{question}\nPlease reason step by step, and put your final answer within \\boxed{{}}."

data:
  processed_dir: data/processed
  seed: 20261024
  sources:
    gsm8k:    {hf_path: openai/gsm8k, hf_name: main, split: test}
    math500:  {hf_path: HuggingFaceH4/MATH-500, hf_name: null, split: test}
    aime2025: {hf_path: yentinglin/aime_2025, hf_name: default, split: train}
  tiers:
    easy:     {gsm8k: 200}
    moderate: {math500_levels: [2, 3]}
    hard:     {math500_levels: [5], aime2025: true}
  test_fraction: 0.5

papers:
  dir: data/papers
  n_papers: 100
  composition: {easy: 10, moderate: 6, hard: 4}
  marks: {easy: 1, moderate: 2, hard: 4}

output:
  dir: outputs/full_budget

curves:
  dir: outputs/curves
  budgets: [0, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]
  max_answer_tokens: 64

difficulty:
  dir: outputs/difficulty
  threshold: 0.5
  C: 1.0
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  probe_dir: outputs/probe
  probe_tokens: 128
  self_rating_prompt: "Here is a math problem.\n\n{question}\n\nWithout solving it, rate how hard it is for you on a scale from 1 (very easy) to 5 (very hard). Reply with a single digit."

policies:
  dir: outputs/eval
  total_budgets: [2048, 4096, 8192, 16384, 32768, 65536]
  knapsack_unit: 128
  tier_ratio: {easy: 1, moderate: 2, hard: 4}
  ratio_search: [1, 2, 4, 8]
  triage_budget: 256
  predictor: tier+text
  predictor_policies: [P3_knapsack, P3_knapsack+roll, P7_shadow]
  compare_predictors: [tier, tier+text, embed, knn, self, probe, icl, icl_raw, icl+text]

bandit:
  dir: outputs/bandit
  alpha: 0.5
  reg: 1.0
  epochs: 20
  seed: 20261024
  lambdas: [0.0, 0.05, 0.1, 0.2, 0.5, 1.0, 2.0, 4.0]

selfalloc:
  dir: outputs/selfalloc
  n_papers: 100
  n_samples: 4
  chunk_papers: 10
  compare_policies: [P0_equal, P2_ratio, P3_knapsack+roll, P6_icl_paper, P7_shadow+roll, oracle, oracle_hindsight]
  budgets: [2048, 4096, 8192, 16384]
  max_model_len: 32768
  answer_tokens: 1024
  header: "This is an exam paper with {n} questions worth {marks} marks in total. You have a total thinking budget of {budget} tokens for the whole paper, so decide how much effort each question deserves. Easy questions should not need much; skip a question if it is not worth the tokens."
  footer: "After thinking, write one line per question in the form \"Q<k>: \\boxed{{answer}}\" for k = 1 to {n}, in order. Give an answer for every question, even if it is a guess."

icl:
  dir: outputs/icl
  label_source: auto
  shots: [0, 2, 4, 8, 16]
  selections: [retrieved, random, shuffled]
  main: {selection: retrieved, k: 8}
  seed: 20261024
  n_papers: 100
  max_model_len: 16384
  paper_answer_tokens: 400
  charge_prompt_tokens: false
  question_header: "You will see math problems, each labelled with how many thinking tokens you needed to solve it reliably. Choose the label for the last problem from the options. Reply with the letter only."
  paper_header: "This is an exam paper with {n} questions. You have a total thinking budget of {budget} tokens for the whole paper. Decide how many thinking tokens each question should get. Allowed amounts per question: {grid}. Easy questions need few tokens; give 0 to a question that is not worth it."
  paper_footer: "Write one line per question in the form \"Q<k>: <tokens>\" for k = 1 to {n}, in order, and nothing else. The amounts must add up to at most {budget}."

valid:
  dir: outputs/valid

realbudget:
  dir: outputs/realbudget
  seed: 20261024
  n_per_tier: 24
  n_samples: 2
  budgets: [512, 2048, 8192]
  prefix_traces: 50
  prefix_cap: 1024
  budget_line: "Think for at most {budget} thinking tokens before answering."

latency:
  dir: outputs/latency
  n_papers: 3
  budget: 16384
  policies: [P0_equal, P2_ratio, P3_knapsack+roll, P7_shadow+roll]

ablations:
  dir: outputs/ablations
  n_papers: 100
  seed: 20261111
  policies: [P0_equal, P1_in_order, P2_ratio, P3_knapsack+roll, P7_shadow+roll, oracle, oracle_hindsight]
  variants:
    default: {}
    equal_marks: {marks: {easy: 1, moderate: 1, hard: 1}}
    easy_heavy: {composition: {easy: 14, moderate: 4, hard: 2}}
    hard_heavy: {composition: {easy: 4, moderate: 6, hard: 10}}
    size_10: {composition: {easy: 5, moderate: 3, hard: 2}, budget_scale: 0.5}
    size_40: {composition: {easy: 20, moderate: 12, hard: 8}, budget_scale: 2}
    gsm8k_clean: {exclude: [gsm8k-288, gsm8k-649, gsm8k-749, gsm8k-380, gsm8k-552, gsm8k-835, gsm8k-962, gsm8k-1074]}
  cost_policies: [P3_knapsack+roll@probe, P3_knapsack+roll@self, P3_knapsack+roll@icl, P3_knapsack+roll@all]

stats:
  dir: outputs/stats
  n_boot: 1000
  workers: 8
  seed: 20261024
  budgets: [8192, 16384, 32768]
  policies: [P0_equal, P1_in_order, P2_ratio_tuned+roll, P3_knapsack+roll, P4_triage,
             P7_shadow+roll, oracle+roll, oracle_hindsight]
  comparisons:
    - [P3_knapsack+roll@icl, P3_knapsack+roll@knn]
    - [P3_knapsack+roll@icl, P2_ratio_tuned+roll]
    - [P3_knapsack+roll@icl, P3_knapsack+roll@icl/retrieved_k0]

plots:
  dir: reports/figures
